app:
  name: SpecLabOS
  host: 127.0.0.1
  port: 8000

mongo:
  uri: mongodb://admin:password123@127.0.0.1:27018
  database: spectrum_alab

minio:
  endpoint: 127.0.0.1:9000
  access_key: minioadmin
  secret_key: minioadmin
  bucket: speclabos-data
  secure: false

datahub:
  api_token: dev-datahub-token
  database: speclabos_data

auth:
  enabled: true
  token_expire_hours: 12
  secret: <SAME_AS_AI4MS_AUTH_SECRET>
  user_mongo_uri: <SAME_AS_AI4MS_MONGODB_URI>
  user_database: ai4ms

smartaccess:
  api_token: dev-smartaccess-token

rabbitmq:
  host: 127.0.0.1
  port: 5672
  username: admin
  password: password123

device_images:
  image_dir: images

device_logs:
  raman_dir: \\100.66.91.117\raman_log
  gpc_lcms_dir: \\100.74.253.59\logs_app
  nmr_dir: \\100.99.21.29\nmr_log
  gpc_rate_csv: E:/spectrum_files/gpc_lcms_auto_rate_records.csv
  lcms_rate_csv: E:/spectrum_files/gpc_lcms_auto_rate_records.csv
  nmr_rate_csv: E:/spectrum_files/nmr_auto_rate_records.csv
  raman_window_days: 3

apis:
  sciverse:
    base_url: https://api.sciverse.space
    api_token: <YOUR_SCIVERSE_API_TOKEN>
    timeout: 30
  dianshi:
    mcp_url: https://dianshi.opendatalab.org.cn/api/mcp
    api_token: <YOUR_DIANSHI_API_TOKEN>
    timeout: 30

runtime:
  sim_mode: true
  status_poll_interval_seconds: 10
  runner_interval_seconds: 1

llm:
  api_key: "<YOUR_LLM_API_KEY>"
  base_url: "https://api.deepseek.com/v1"
  model: "deepseek-v4-pro"
